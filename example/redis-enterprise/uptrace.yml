# Uptrace configuration for the Redis Enterprise example.
# For all options with comments, see ../docker/uptrace.yml and
# https://uptrace.dev/get/hosted/config

service:
  env: hosted
  # Generate a new value with: openssl rand -hex 32
  secret: 3f8a1c9e5b7d2f4a6c8e0b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1a

site:
  url: http://localhost:14318
  ingest_url: http://localhost:14318?grpc=14317

listen:
  http:
    addr: :80
  grpc:
    addr: :4317

seed_data:
  update: true
  delete: true

  users:
    - key: user1
      name: Admin
      email: admin@uptrace.local
      password: admin
      email_confirmed: true

  user_tokens:
    - key: user_token1
      user_key: user1
      token: user1_secret

  orgs:
    - key: org1
      name: Org1

  org_users:
    - key: org_user1
      org_key: org1
      user_key: user1
      role: owner

  projects:
    - key: project1
      name: Project1
      org_key: org1

  project_tokens:
    - key: project_token1
      project_key: project1
      token: project1_secret

  project_users:
    - key: project_user1
      project_key: project1
      org_user_key: org_user1
      perm_level: admin

ch_cluster:
  cluster: uptrace1
  shards:
    - replicas:
        - addr: clickhouse:9000
          database: uptrace
          user: uptrace
          password: uptrace

pg:
  addr: postgres:5432
  user: uptrace
  password: uptrace
  database: uptrace

redis_cache:
  addrs:
    1: redis:6379

mailer:
  smtp:
    enabled: true
    host: mailpit
    port: 1025
    username: mailpit
    password: mailpit
    from: no-reply@uptrace.local

self_monitoring:
  dsn: http://project1_secret@uptrace:80?grpc=4317

logging:
  level: INFO
